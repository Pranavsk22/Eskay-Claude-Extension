<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eskay UI Visual Verification</title>
  <link rel="stylesheet" href="eskay/styles/toolbar.css">
  <style>
    body {
      background-color: #1a1a19;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .chat-layout {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .chat-messages {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 24px;
      min-height: 200px;
    }

    .mock-message {
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .mock-message.assistant {
      color: #d1d5db;
    }

    /* Simulated Claude Input Card Container */
    .claude-input-card {
      background: #242423;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .claude-textarea {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      min-height: 60px;
      resize: none;
      font-family: inherit;
    }

    .claude-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    .claude-left-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .claude-right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .claude-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .claude-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .claude-btn-primary {
      background: #E8721C;
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      padding: 6px 14px;
    }

    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>
<body>

  <button class="theme-toggle-btn" id="toggle-theme">Toggle Light/Dark Theme</button>

  <div class="chat-layout">
    <h2>Claude.ai Chat View Simulation</h2>
    <p style="color: #9ca3af; font-size: 13px;">Demonstrating Eskay positioned safely ABOVE the input box, leaving Plus icon, Cowork switch, Model selector, and Microphone completely accessible.</p>

    <div class="chat-messages">
      <div class="mock-message assistant">
        <strong>Claude:</strong> Hello! How can I help you today?
      </div>
    </div>

    <!-- Eskay Toolbar will be injected right here above the input card -->

    <!-- Claude Input Card -->
    <div class="claude-input-card" id="chat-input-wrapper">
      <textarea class="claude-textarea" placeholder="Reply to Claude..."></textarea>
      
      <div class="claude-bottom-bar">
        <div class="claude-left-tools">
          <button class="claude-btn" id="btn-plus" title="Add content / attach files">➕ Plus / Attach</button>
          <button class="claude-btn" id="btn-cowork" title="Switch Chat / Cowork Mode">🔄 Chat / Cowork</button>
        </div>
        <div class="claude-right-tools">
          <button class="claude-btn" id="btn-model" data-testid="model-selector-dropdown">Claude 3.7 Sonnet ▾</button>
          <button class="claude-btn" id="btn-mic" title="Voice Input">🎙️ Mic</button>
          <button class="claude-btn claude-btn-primary" id="btn-send">Send ➔</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mock Eskay Modules -->
  <script>
    window.Eskay = {
      DOM: {
        CHAT_MENU_TRIGGER: '#chat-menu',
        MODEL_SELECTOR_DROPDOWN: '[data-testid="model-selector-dropdown"]',
        CHAT_PROJECT_WRAPPER: '.chat-layout'
      }
    };

    window.EskayOptimizer = {
      detectPromptFeatures: () => ({}),
      preserveCodeBlocksAndRawCode: (t) => ({ text: t, codeBlocks: [] }),
      restoreCodeBlocksAndRawCode: (t) => t,
      sanitize: (t) => t,
      applySubOptions: (t) => t,
      optimize: (t, m) => `[${m}] ` + t
    };

    window.EskayTokenizer = {
      countTokens: (t) => Math.ceil((t || '').length / 4)
    };

    window.EskayUsageTracker = {
      getUsage: () => ({
        session: { pct: 28, resetTime: Date.now() + 1000 * 3600 * 2 },
        weekly: { pct: 45, resetTime: Date.now() + 1000 * 3600 * 48 },
        context: { tokens: 14200 },
        cache: { resetTime: Date.now() + 1000 * 240 }
      })
    };
  </script>

  <script src="eskay/src/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.EskayUI.init();

      document.getElementById('toggle-theme').addEventListener('click', () => {
        document.body.classList.toggle('light');
        if (document.body.classList.contains('light')) {
          document.body.style.backgroundColor = '#f3f4f6';
          document.body.style.color = '#111827';
          document.getElementById('eskay-toolbar').classList.add('ek-light-mode');
        } else {
          document.body.style.backgroundColor = '#1a1a19';
          document.body.style.color = '#e5e7eb';
          document.getElementById('eskay-toolbar').classList.remove('ek-light-mode');
        }
      });
    });
  </script>
</body>
</html>
